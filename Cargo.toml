[workspace]
resolver = "3"
members = [
  "crates/api",
  "crates/core-ir",
  "crates/parser",
  "crates/resolver",
  "crates/store-sqlite",
  "crates/enricher",
  "crates/embed-client",
  "crates/indexer",
  "crates/search",
  "crates/read-api",
  "crates/watcher",
  "crates/cli",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.1"
description = "Rust-first code intelligence, search, and read context for coding agents"
repository = "https://github.com/SRSWTI/matryoshka"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
walkdir = "2"

matryoshka-core-ir = { version = "0.1.1", path = "crates/core-ir" }
matryoshka = { version = "0.1.1", path = "crates/api" }
matryoshka-parser = { version = "0.1.1", path = "crates/parser" }
matryoshka-resolver = { version = "0.1.1", path = "crates/resolver" }
matryoshka-store-sqlite = { version = "0.1.1", path = "crates/store-sqlite" }
matryoshka-enricher = { version = "0.1.1", path = "crates/enricher" }
matryoshka-embed-client = { version = "0.1.1", path = "crates/embed-client" }
matryoshka-indexer = { version = "0.1.1", path = "crates/indexer" }
matryoshka-search = { version = "0.1.1", path = "crates/search" }
matryoshka-read-api = { version = "0.1.1", path = "crates/read-api" }
matryoshka-watcher = { version = "0.1.1", path = "crates/watcher" }
