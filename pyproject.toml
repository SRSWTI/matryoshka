[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cradle"
version = "0.1.0"
description = "Cradle extraction foundation"
requires-python = ">=3.12"
dependencies = [
  "mlx-embeddings>=0.1.0; platform_system == 'Darwin'",
  "networkx",
  "numpy",
  "tree-sitter",
  "tree-sitter-python",
  "tree-sitter-typescript",
]

[project.optional-dependencies]
cpu = [
  "sentence-transformers>=3,<6",
]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
cradle = "cradle.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]